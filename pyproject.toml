[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-rpc"
version = "0.1.0"
description = "ARX-anchored residual-path correction for electricity price forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "torch>=2.2,<3"]

[project.scripts]
arx-rpc = "arx_rpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
